[project]
name = "emg-simulator"
version = "0.0.1"
description = "EMG-driven robot-arm reaching-game simulator (open-campus exhibit)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: slow tests (deselect with '-m \"not slow\"')",
]
