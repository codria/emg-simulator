<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1024" viewBox="0 0 760 1024"><rect width="760" height="1024" fill="#ffffff"/><rect x="24" y="16" width="712" height="384" rx="12" fill="#e9f1f8" stroke="#9db4c7" stroke-width="1.5"/><text x="40" y="37" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="700">① 信号処理  ―  生 EMG を「力の量」に均す</text><rect x="165" y="60" width="430" height="54" rx="8" fill="#ffffff" stroke="#9db4c7" stroke-width="1.5"/><text x="380" y="82" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="600">生 EMG 2ch</text><text x="380" y="102" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">サンプリング ≥ 1000 Hz</text><line x1="380" y1="114" x2="380" y2="128" stroke="#5b6472" stroke-width="2"/><path d="M375,122 L385,122 L380,128 Z" fill="#5b6472"/><rect x="165" y="128" width="430" height="54" rx="8" fill="#ffffff" stroke="#9db4c7" stroke-width="1.5"/><text x="380" y="150" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="600">帯域通過フィルタ</text><text x="380" y="170" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">20 – 450 Hz</text><line x1="380" y1="182" x2="380" y2="196" stroke="#5b6472" stroke-width="2"/><path d="M375,190 L385,190 L380,196 Z" fill="#5b6472"/><rect x="165" y="196" width="430" height="54" rx="8" fill="#ffffff" stroke="#9db4c7" stroke-width="1.5"/><text x="380" y="218" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="600">ノッチフィルタ</text><text x="380" y="238" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">50 / 60 Hz（電源ハム除去）</text><line x1="380" y1="250" x2="380" y2="264" stroke="#5b6472" stroke-width="2"/><path d="M375,258 L385,258 L380,264 Z" fill="#5b647