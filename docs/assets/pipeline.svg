 font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="600">スケール除算</text><text x="380" y="576" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">scale（オンライン適応）</text><line x1="380" y1="588" x2="380" y2="602" stroke="#5b6472" stroke-width="2"/><path d="M375,596 L385,596 L380,602 Z" fill="#5b6472"/><rect x="165" y="602" width="430" height="54" rx="8" fill="#ffffff" stroke="#b3a6cf" stroke-width="1.5"/><text x="380" y="624" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="600">ソフト飽和  tanh</text><text x="380" y="644" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">利得 = sat_gain</text><line x1="380" y1="656" x2="380" y2="670" stroke="#5b6472" stroke-width="2"/><path d="M375,664 L385,664 L380,670 Z" fill="#5b6472"/><rect x="165" y="670" width="430" height="54" rx="8" fill="#ffffff" stroke="#b3a6cf" stroke-width="1.5"/><text x="380" y="692" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="600">活性度 a</text><text x="380" y="712" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">0 – 1（制御・判定に使う値）</text><line x1="380" y1="738" x2="380" y2="752" stroke="#5b6472" stroke-width="2"/><path d="M375,746 L385,746 L380,752 Z" fill="#5b6472"/><rect x="24" y="760" width="712" height="248" rx="12" fill="#e7f4ec" stroke="#a3ccb0" stroke-width="1.5"/><text x="40" y="781" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="start" font-weight="700">③ マッピング  ―  0–1 を到達域→関節角に</text><rect x="165" y="804" width="430" height="54" rx="8" fill="#ffffff" stroke="#a3ccb0" stroke-width="1.5"/><text x="380" y="826" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="600">マッピング</text><text x="380" y="846" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">左 → θ（向き） ／ 右 → r（伸び）</text><line x1="380" y1="858" x2="380" y2="872" stroke="#5b6472" stroke-width="2"/><path d="M375,866 L385,866 L380,872 Z" fill="#5b6472"/><rect x="165" y="872" width="430" height="54" rx="8" fill="#ffffff" stroke="#a3ccb0" stroke-width="1.5"/><text x="380" y="894" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="600">逆運動学  IK</text><text x="380" y="914" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">(r, θ) → 6 関節角</text><line x1="380" y1="926" x2="380" y2="940" stroke="#5b6472" stroke-width="2"/><path d="M375,934 L385,934 L380,940 Z" fill="#5b6472"/><rect x="165" y="940" width="430" height="54" rx="8" fill="#ffffff" stroke="#a3ccb0" stroke-width="1.5"/><text x="380" y="962" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="16" fill="#1f2430" text-anchor="middle" font-weight="600">ロボットアーム</text><text x="380" y="982" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" fill="#5b6472" text-anchor="middle">6 自由度</text></svg>